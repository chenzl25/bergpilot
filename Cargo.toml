[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/chenzl25/bergpilot"
publish = false

[workspace.dependencies]
# The RisingWave fork of iceberg-rust, pinned to the revision iceberg-compaction uses.
iceberg = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "6e974ce0b94b93a3bf0a1c5005628529794a96d4" }
iceberg-catalog-glue = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "6e974ce0b94b93a3bf0a1c5005628529794a96d4" }
iceberg-catalog-rest = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "6e974ce0b94b93a3bf0a1c5005628529794a96d4" }
iceberg-catalog-s3tables = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "6e974ce0b94b93a3bf0a1c5005628529794a96d4" }
iceberg-catalog-sql = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "6e974ce0b94b93a3bf0a1c5005628529794a96d4" }
iceberg-datafusion = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "6e974ce0b94b93a3bf0a1c5005628529794a96d4" }
iceberg-storage-opendal = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "6e974ce0b94b93a3bf0a1c5005628529794a96d4", default-features = false, features = ["opendal-fs", "opendal-memory", "opendal-s3"] }
# Pinned to the revision that uses the same iceberg-rust revision as above.
iceberg-compaction-core = { git = "https://github.com/nimtable/iceberg-compaction.git", rev = "ce9ec52ce6100f44a965f1ea6f8787331078439c" }
# Must match the DataFusion version the fork is built against.
datafusion = "54.1.0"

[profile.release]
lto = "thin"
codegen-units = 4
