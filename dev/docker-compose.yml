# Local development environment: an Iceberg REST catalog backed by
# S3-compatible object storage. Not part of the BergPilot release.
#
#   docker compose -f dev/docker-compose.yml up -d
#
# Catalog URI: http://localhost:8181
# Storage:     http://localhost:9000 (access key "admin", secret "password")
name: bergpilot-dev

services:
  object-store:
    image: rustfs/rustfs:1.0.0
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=password
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  create-bucket:
    image: rustfs/rustfs:1.0.0
    depends_on:
      object-store:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 -u admin:password -X PUT http://object-store:9000/warehouse"

  rest:
    image: apache/iceberg-rest-fixture:1.10.1
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_CATALOG__IMPL=org.apache.iceberg.jdbc.JdbcCatalog
      - CATALOG_URI=jdbc:sqlite:file:/tmp/iceberg_rest_mode=memory
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://object-store:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
